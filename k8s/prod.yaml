apiVersion: v1
kind: Namespace
metadata:
  name: celebra-prod
  labels:
    app.kubernetes.io/name: celebra-events
    app.kubernetes.io/environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: celebra-config
  namespace: celebra-prod
data:
  APP_ENV: "production"
  NEXT_PUBLIC_APP_ENV: "production"
  NEXT_PUBLIC_BASE_URL: "https://celebra.omegatork.com"
  # Legacy JSON store, read once by scripts/import-json.mjs during the Postgres migration.
  DATA_FILE_PATH: "/app/data/db.json"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celebra-data-pvc
  namespace: celebra-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: celebra-app-pvc
  namespace: celebra-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celebra-web
  namespace: celebra-prod
  labels:
    app: celebra-web
    env: production
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: celebra-web
      env: production
  template:
    metadata:
      labels:
        app: celebra-web
        env: production
    spec:
      # The app PVC is node-local (hostpath), so the pod must stay on the node that holds it.
      nodeSelector:
        kubernetes.io/hostname: mllse02
      containers:
        - name: celebra-web
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app/runtime
          # Interim runtime until container images exist (ADR-0003). See stage.yaml.
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f /app/runtime/current/.next/standalone/server.js ]; then
                cd /app/runtime/current/.next/standalone
              elif [ -f /app/runtime/.next/standalone/server.js ]; then
                echo "Starting legacy build (pre-releases layout)"
                cd /app/runtime/.next/standalone
              else
                echo "No build yet; waiting for deploy-cluster.sh"
                while [ ! -f /app/runtime/current/.next/standalone/server.js ]; do sleep 3; done
                cd /app/runtime/current/.next/standalone
              fi
              export PORT=3000 HOSTNAME=0.0.0.0
              exec node server.js
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: celebra-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: celebra-db-app
                  key: uri
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: celebra-auth
                  key: admin-password
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: celebra-auth
                  key: session-secret
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            - name: app-volume
              mountPath: /app/runtime
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: celebra-data-pvc
        - name: app-volume
          persistentVolumeClaim:
            claimName: celebra-app-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: celebra-lb
  namespace: celebra-prod
  annotations:
    metallb.io/loadBalancerIPs: "192.168.100.241"
spec:
  type: LoadBalancer
  selector:
    app: celebra-web
    env: production
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000

# PostgreSQL for prod, managed by the CloudNativePG operator (cnpg-system).
# 2 instances: primary + streaming replica. CNPG prefers placing them on different
# nodes, so losing one node keeps a copy of the data on the other.
# NOTE: no off-site backups yet. See Documentation/04-infrastructure.md (R2 backups).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: celebra-db
  namespace: celebra-prod
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: microk8s-hostpath
  bootstrap:
    initdb:
      database: celebra
      owner: celebra
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      memory: "768Mi"
